<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snapt · Search for similar images</title>
<style>
  body {{ margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; background: #1b1b1f; color: #f4f4f6;
    font: 15px/1.5 system-ui, sans-serif; text-align: center; }}
  img {{ max-width: 60vw; max-height: 50vh; border-radius: 8px; }}
  p {{ margin: 0; color: #a1a1aa; }}
  a {{ color: #a78bfa; }}
</style>
</head>
<body>
<img src="{image}" alt="Screenshot">
<p>Uploading to Google Lens…</p>
<p>If nothing happens, open <a href="https://lens.google.com/">Google Lens</a> and paste the screenshot: it is on the clipboard.</p>
<form id="lens" method="post" enctype="multipart/form-data"
      action="https://lens.google.com/v3/upload?ep=ccm&amp;s=&amp;st=0">
  <input type="file" name="encoded_image" hidden>
</form>
<script>
  fetch(document.querySelector("img").src)
    .then((response) => response.blob())
    .then((blob) => {{
      const files = new DataTransfer();
      files.items.add(new File([blob], "screenshot.png", {{ type: "image/png" }}));
      const form = document.getElementById("lens");
      form.encoded_image.files = files.files;
      form.action = form.action.replace("st=0", "st=" + Date.now());
      form.submit();
    }});
</script>
</body>
</html>
