<!doctype html>
<html lang="{lang}">
<head>
<meta charset="utf-8">
<title>Snapt · {title}</title>
<style>
  html, body {{ margin: 0; background: #1b1b1f; }}
  body {{ display: flex; min-height: 100vh; align-items: center; justify-content: center; }}
  img {{ max-width: 100%; max-height: 100vh; }}
  @media print {{
    html, body {{ background: none; }}
    img {{ max-height: none; }}
  }}
</style>
</head>
<body>
<img src="{image}" alt="Screenshot" onload="setTimeout(() => window.print(), 100)">
</body>
</html>
