[package]
name = "snapt-setup"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "The Windows installer and uninstaller for Snapt."
license = "MIT"
publish = false

# The version shown and registered comes from the root Cargo.toml (see build.rs).
# The Snapt binary to install is passed in SNAPT_EXE at build time:
# `SNAPT_EXE=target/release/snapt.exe cargo build --release -p snapt-setup`.

[[bin]]
name = "snapt-setup"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
miniz_oxide = "0.8"
softbuffer = "0.4"
sys-locale = "0.3"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
miniz_oxide = "0.8"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Saves the window previews in the tests as PNG.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
