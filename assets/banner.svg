<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#sky)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- A selection frame, as Snapt draws it over the screen -->
  <g transform="translate(820 70)">
    <rect width="360" height="260" rx="6" fill="#fff" fill-opacity=".06" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="10 8"/>
    <g fill="#fff" stroke="#5B21B6" stroke-width="2">
      <rect x="-6" y="-6" width="12" height="12" rx="2"/>
      <rect x="354" y="-6" width="12" height="12" rx="2"/>
      <rect x="-6" y="254" width="12" height="12" rx="2"/>
      <rect x="354" y="254" width="12" height="12" rx="2"/>
    </g>
    <rect x="0" y="-40" width="92" height="26" rx="6" fill="#8B5CF6"/>
    <text x="46" y="-22" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">360 × 260</text>
    <path d="M60 200 L210 90" stroke="#F472B6" stroke-width="7" stroke-linecap="round"/>
    <path d="M182 92 L210 90 L198 116" fill="none" stroke="#F472B6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="226" y="150" width="104" height="70" rx="4" fill="none" stroke="#FBBF24" stroke-width="5"/>
    <!-- Toolbar -->
    <g transform="translate(376 40)">
      <rect width="48" height="180" rx="12" fill="#fff" fill-opacity=".95"/>
      <g fill="#6D28D9">
        <circle cx="24" cy="28" r="7"/>
        <rect x="16" y="60" width="16" height="16" rx="3"/>
        <path d="M14 112 L34 100 L30 116 Z"/>
        <text x="24" y="160" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">T</text>
      </g>
    </g>
  </g>

  <!-- Logo and wordmark -->
  <g transform="translate(96 120)">
    <rect width="96" height="96" rx="21" fill="url(#tile)"/>
    <g fill="none" stroke="#fff" stroke-width="6.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 38.4V23h15.4"/>
      <path d="M57.6 23H73v15.4"/>
      <path d="M73 57.6V73H57.6"/>
      <path d="M38.4 73H23V57.6"/>
    </g>
    <circle cx="48" cy="48" r="6.75" fill="#fff"/>
  </g>
  <text x="220" y="196" fill="#fff" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="84" font-weight="800" letter-spacing="-2">Snapt</text>
  <text x="98" y="276" fill="#DDD6FE" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30">Select. Annotate. Copy.</text>
  <text x="98" y="318" fill="#A78BFA" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20">Open-source screenshots for Windows, macOS and Linux</text>
</svg>
