name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, artifact: snapt }
          - { name: Windows, os: windows-latest, artifact: snapt.exe }
          - { name: macOS, os: macos-latest, artifact: snapt }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev clang
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Test against a fake desktop portal
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y python3-dbus python3-gi dbus
          dbus-run-session -- sh -c 'python3 tests/portal-mock.py & sleep 2; cargo test --locked -- --ignored portal'
      - name: Upload failed snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-${{ runner.os }}
          path: target/snapshots
          if-no-files-found: ignore
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: snapt-${{ runner.os }}
          path: target/release/${{ matrix.artifact }}

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the scripts
        run: for f in extension/src/*.js; do node --check "$f"; done
      - run: python3 extension/build.py
