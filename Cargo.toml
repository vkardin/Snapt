[package]
name = "snapt"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, lightweight, open-source screenshot tool for Windows, macOS and Linux."
license = "MIT"
repository = "https://github.com/vkardin/snapt"
homepage = "https://vkardin.github.io/snapt/"
readme = "README.md"
keywords = ["screenshot", "screen-capture", "annotation", "lightshot"]
categories = ["multimedia::images", "gui"]

[dependencies]
anyhow = "1"
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
global-hotkey = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
open = "5"
winit = "0.30"
xcap = { version = "0.9", default-features = false }
softbuffer = "0.4"
rfd = "0.17"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
sys-locale = "0.3"

# The KSNI backend talks to the tray over D-Bus directly, so Linux builds need no GTK.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true

# Installers are built with cargo-packager: `cargo build --release && cargo packager --release`.
# See .github/workflows/release.yml for the formats built on each platform.
# Gives snapt.exe its icon in Explorer and the taskbar.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "Snapt"
identifier = "io.github.vkardin.snapt"
publisher = "vkardin"
authors = ["vkardin"]
homepage = "https://github.com/vkardin/snapt"
category = "Utility"
copyright = "Copyright (c) vkardin. MIT License."
out-dir = "target/packages"
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/512x512.png",
    "assets/icons/icon.icns",
    "assets/icons/icon.ico",
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Ad-hoc signature: no Apple Developer ID yet, but Apple Silicon refuses fully unsigned apps.
signing-identity = "-"

[package.metadata.packager.nsis]
# Install per user, so the installer needs no administrator rights.
installer-mode = "currentUser"
installer-icon = "assets/icons/icon.ico"
header-image = "assets/installer/header.bmp"
sidebar-image = "assets/installer/sidebar.bmp"
languages = ["English", "Russian", "Ukrainian"]
display-language-selector = false

[package.metadata.packager.deb]
depends = ["libxcb1", "libxkbcommon-x11-0", "libxcb-randr0", "libxcb-shm0", "libdbus-1-3", "libpipewire-0.3-0", "libwayland-client0", "libegl1", "libgbm1"]
